name: Build Windows exe

on:
  push:
    branches: ["claude/car-app-manager-desktop-erb3tu", "main"]
    paths-ignore: ["*.js", "*.css", "index.html", "vite.config.ts", "package.json", "vite.svg"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Embed build info
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          '{"sha": "' + "${{ github.sha }}" + '", "date": "' + $date + '"}' | Set-Content -Encoding utf8 src\car_app_manager\resources\build.json
          Get-Content src\car_app_manager\resources\build.json

      - name: Build CarAppManager.exe
        run: |
          python assets\make_icon.py
          python -m PyInstaller --noconfirm --clean CarAppManager.spec
          dist\CarAppManager.exe --version

      - name: Smoke-test the exe (real Windows GUI, APK inspection inside the frozen build)
        shell: pwsh
        env:
          CAR_APP_MANAGER_SKIP_FIRSTRUN: "1"
        run: |
          # 1) the frozen androguard must parse a real APK (windowed exe has no stdout -> --out file)
          Invoke-WebRequest -Uri "https://f-droid.org/F-Droid.apk" -OutFile "$env:TEMP\fdroid.apk"
          $r = Start-Process -FilePath "dist\CarAppManager.exe" -ArgumentList "--inspect `"$env:TEMP\fdroid.apk`" --out `"$env:TEMP\inspect.json`"" -PassThru -Wait
          if ($r.ExitCode -ne 0) { Write-Error "--inspect exited with $($r.ExitCode)"; exit 1 }
          $j = Get-Content "$env:TEMP\inspect.json" -Raw | ConvertFrom-Json
          if ($j.package -ne "org.fdroid.fdroid" -or $j.min_sdk -lt 1) { Write-Host "parse_error: $($j.parse_error)"; Get-Content "$env:TEMP\inspect.json" -Raw; Write-Error "unexpected inspect result: $($j.package) minSdk=$($j.min_sdk)"; exit 1 }
          Write-Host "inspect OK: $($j.package) $($j.version_name) minSdk=$($j.min_sdk) abis=$($j.native_abis)"
          # 2) the GUI must start with the native Windows platform plugin and reach the main window
          $p = Start-Process -FilePath "dist\CarAppManager.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          $log = Get-Content "$env:LOCALAPPDATA\CarAppManager\logs\car_app_manager.log" -Raw
          if ($log -notmatch "app started") { Write-Error "main window did not initialise (no 'app started' in log)"; Write-Host $log; exit 1 }
          Write-Host "GUI started on the native Windows platform - OK"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\CarAppManager.iss

      - uses: actions/upload-artifact@v4
        with:
          name: CarAppManager-windows
          path: |
            dist/CarAppManager.exe
            installer_output/CarAppManager-Setup.exe
          if-no-files-found: error

      - name: Publish release (latest build)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: car-app-manager-latest
          name: Car App Manager (latest build)
          prerelease: true
          body: |
            Automatic build from ${{ github.sha }} on branch ${{ github.ref_name }}.
            - `CarAppManager.exe` — portable, single file (no install needed)
            - `CarAppManager-Setup.exe` — installer
            First run downloads Android Platform-Tools (adb) from Google. See README.md.
          files: |
            dist/CarAppManager.exe
            installer_output/CarAppManager-Setup.exe
