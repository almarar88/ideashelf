name: Build Majlis AI for Windows

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["app/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Package Windows installer and portable exe
        run: npx electron-builder --win --publish never
      - name: List outputs
        run: Get-ChildItem dist-electron
      - uses: actions/upload-artifact@v4
        with:
          name: MajlisAI-windows
          path: |
            app/dist-electron/MajlisAI-Setup-*.exe
            app/dist-electron/MajlisAI-Portable-*.exe
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Majlis AI — latest builds
          body: |
            **Android:** MajlisAI.apk — ثبّته مباشرة.
            **iPhone:** MajlisAI-unsigned.ipa — غير موقّع؛ ثبّته عبر Sideloadly أو AltStore بحساب Apple ID.
            **Windows:** MajlisAI-Setup-x.y.z.exe (مثبّت) أو MajlisAI-Portable-x.y.z.exe (بدون تثبيت).
          files: |
            app/dist-electron/MajlisAI-Setup-*.exe
            app/dist-electron/MajlisAI-Portable-*.exe
