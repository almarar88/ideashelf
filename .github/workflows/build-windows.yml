name: Build LiwaBot for Windows

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["app/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Package Windows installer and portable exe
        run: npx electron-builder --win --publish never
      - name: List outputs
        run: Get-ChildItem dist-electron
      - uses: actions/upload-artifact@v4
        with:
          name: LiwaBot-windows
          path: |
            app/dist-electron/LiwaBot-Setup-*.exe
            app/dist-electron/LiwaBot-Portable-*.exe
      - name: Read version
        id: ver
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "build=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LiwaBot ${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }})
          body: |
            **Android:** LiwaBot.apk — ثبّته مباشرة.
            **iPhone:** LiwaBot-unsigned.ipa — غير موقّع؛ ثبّته عبر Sideloadly أو AltStore بحساب Apple ID.
            **Windows:** LiwaBot-Setup-x.y.z.exe (مثبّت) أو LiwaBot-Portable-x.y.z.exe (بدون تثبيت).
          files: |
            app/dist-electron/LiwaBot-Setup-*.exe
            app/dist-electron/LiwaBot-Portable-*.exe
