name: Build LiwaBot APK

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK 36 (preinstalled SDK on ubuntu runners)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LiwaBot.apk
      - name: Write version.json (read by the in-app update checker)
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)
          printf '{"version":"%s","build":%s,"date":"%s"}\n' "$VERSION" "$BUILD" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          cat version.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: LiwaBot.apk
          path: app/LiwaBot.apk
      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LiwaBot ${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }})
          body: |
            **Android:** LiwaBot.apk — ثبّته مباشرة.
            **iPhone:** LiwaBot-unsigned.ipa — غير موقّع؛ ثبّته عبر Sideloadly أو AltStore بحساب Apple ID.
            **Windows:** LiwaBot-Setup-x.y.z.exe (مثبّت) أو LiwaBot-Portable-x.y.z.exe (بدون تثبيت).
          files: |
            app/LiwaBot.apk
            app/version.json
          prerelease: false
