name: Build Majlis AI APK

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MajlisAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MajlisAI-apk
          path: app/MajlisAI.apk
      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Majlis AI — latest APK
          body: "آخر إصدار من تطبيق مجلس (Majlis AI). حمّل MajlisAI.apk وثبّته على أندرويد."
          files: app/MajlisAI.apk
          prerelease: false
