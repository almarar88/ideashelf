name: Deploy Majlis AI web app (GitHub Pages)

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["app/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build web app
        working-directory: app
        run: npm ci && npm run build
      - name: Assemble site (existing root site + app under /app/)
        run: |
          mkdir -p _site/app
          cp -r app/dist/. _site/app/
          for f in index.html vite.svg *.js *.css; do [ -e "$f" ] && cp "$f" _site/ || true; done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
