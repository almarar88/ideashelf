name: PartnerHub Android APK

on:
  push:
    paths: ["partnerships-app/**", ".github/workflows/partnerhub-android.yml"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partnerships-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: partnerships-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: partnerships-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: partnerhub-debug-apk
          path: partnerships-app/android/app/build/outputs/apk/debug/app-debug.apk
