name: Build Mahami release bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'mahami-v*'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::أضف أسرار التوقيع في إعدادات المستودع قبل تشغيل هذا المسار"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > mahami/mahami-release.jks
          cat > mahami/keystore.properties <<PROPS
          storeFile=mahami-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Run unit tests
        working-directory: mahami
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build signed bundle and APK
        working-directory: mahami
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Remove signing material
        if: always()
        run: rm -f mahami/mahami-release.jks mahami/keystore.properties

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mahami-release
          path: |
            mahami/app/build/outputs/bundle/release/app-release.aab
            mahami/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
