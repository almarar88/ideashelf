<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- LiwaBot app icon: Apple-style squircle, desert-sunset gradient, one white glyph -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA35A"/>
      <stop offset="0.55" stop-color="#F2703C"/>
      <stop offset="1" stop-color="#D8471F"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="squircle"><path id="sq" d="M512 0C122 0 0 122 0 512s122 512 512 512 512-122 512-512S902 0 512 0z"/></clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- soft top-left light -->
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <!-- Liwa dunes: two overlapping ridges at the base -->
    <path d="M-40 850 C 220 690, 420 700, 560 790 C 700 880, 860 860, 1064 760 L 1064 1064 L -40 1064 Z" fill="url(#dune)"/>
    <path d="M-40 930 C 180 820, 380 810, 540 880 C 700 950, 880 930, 1064 850 L 1064 1064 L -40 1064 Z" fill="#FFFFFF" fill-opacity="0.10"/>
  </g>
  <!-- Bot glyph -->
  <g fill="#FFFFFF">
    <!-- antenna -->
    <rect x="497" y="212" width="30" height="76" rx="15"/>
    <circle cx="512" cy="196" r="34"/>
    <!-- ears -->
    <rect x="214" y="470" width="52" height="150" rx="26"/>
    <rect x="758" y="470" width="52" height="150" rx="26"/>
    <!-- head -->
    <path d="M400 300h224c88 0 160 72 160 160v170c0 88-72 160-160 160H400c-88 0-160-72-160-160V460c0-88 72-160 160-160z"/>
  </g>
  <!-- face (cut from the head with gradient colour so it reads as one object) -->
  <g fill="url(#bg)">
    <rect x="386" y="490" width="80" height="120" rx="40"/>
    <rect x="558" y="490" width="80" height="120" rx="40"/>
  </g>
  <!-- smile -->
  <path d="M448 700 q64 46 128 0" fill="none" stroke="#D8471F" stroke-width="30" stroke-linecap="round"/>
</svg>
