appId: com.ideashelf.liwabot
productName: LiwaBot
copyright: IdeaShelf
directories:
  output: dist-electron
  buildResources: build
files:
  - dist/**
  - electron/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: LiwaBot-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: LiwaBot
  artifactName: LiwaBot-Setup-${version}.${ext}
portable:
  artifactName: LiwaBot-Portable-${version}.${ext}
mac:
  target: [dmg]
  category: public.app-category.productivity
linux:
  target: [AppImage]
